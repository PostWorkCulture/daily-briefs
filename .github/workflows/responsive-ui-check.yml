name: Responsive UI check

on:
  pull_request:
    paths:
      - 'index.html'
      - 'pete/**'
      - 'sofia/**'
      - 'css/**'
      - 'js/**'
      - 'assets/weather-extremes/**'
      - 'data/fact-catalog.json'
      - 'data/fact-history.json'
      - 'data/pete.json'
      - 'data/sofia.json'
      - 'scripts/responsive_ui_check.py'
      - 'scripts/enrich_weather_v2.py'
      - 'scripts/refresh.py'
      - 'scripts/enrich_arsenal.py'
      - 'scripts/enrich_next_fixture.py'
      - 'scripts/finalize_arsenal.py'
      - 'tests/test_enrich_arsenal.py'
      - 'tests/test_finalize_arsenal.py'
      - 'tests/test_enrich_weather_v2.py'
      - 'tests/test_world_facts.py'
      - '.github/workflows/responsive-ui-check.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'pete/**'
      - 'sofia/**'
      - 'css/**'
      - 'js/**'
      - 'assets/weather-extremes/**'
      - 'data/fact-catalog.json'
      - 'data/fact-history.json'
      - 'data/pete.json'
      - 'data/sofia.json'
      - 'scripts/responsive_ui_check.py'
      - 'scripts/enrich_weather_v2.py'
      - 'scripts/refresh.py'
      - 'scripts/enrich_arsenal.py'
      - 'scripts/enrich_next_fixture.py'
      - 'scripts/finalize_arsenal.py'
      - 'tests/test_enrich_arsenal.py'
      - 'tests/test_finalize_arsenal.py'
      - 'tests/test_enrich_weather_v2.py'
      - 'tests/test_world_facts.py'
      - '.github/workflows/responsive-ui-check.yml'

jobs:
  responsive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser test dependencies
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Start local site
        run: |
          python -m http.server 4173 >/tmp/daily-briefs-http.log 2>&1 &
          sleep 2

      - name: Check Arsenal fixture and first-team guards
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Check mobile and desktop layouts
        run: python scripts/responsive_ui_check.py

      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-brief-preview
          path: artifacts/*.png
          if-no-files-found: warn
