name: Morning refresh

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/morning-refresh.yml'
      - 'scripts/**'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: daily-briefs-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh brief data
        env:
          GOOGLE_CALENDAR_ICS_URL: ${{ secrets.GOOGLE_CALENDAR_ICS_URL }}
        run: |
          python scripts/refresh.py
          python scripts/enrich_arsenal.py

      - name: Commit refreshed data
        run: |
          git config user.name "Daily Briefs Bot"
          git config user.email "actions@users.noreply.github.com"

          mkdir -p /tmp/daily-briefs-data
          cp data/*.json /tmp/daily-briefs-data/

          git fetch origin main
          git reset --hard origin/main
          cp /tmp/daily-briefs-data/*.json data/

          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi

          git commit -m "Morning refresh: $(TZ=Europe/London date '+%Y-%m-%d')"
          git push origin main
