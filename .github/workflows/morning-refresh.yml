name: Morning refresh

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/morning-refresh.yml'
      - 'scripts/**'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: daily-briefs-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh brief data
        env:
          GOOGLE_CALENDAR_ICS_URL: ${{ secrets.GOOGLE_CALENDAR_ICS_URL }}
        run: |
          python scripts/refresh.py
          python scripts/enrich_weather_v2.py
          python scripts/enrich_arsenal.py
          python scripts/finalize_arsenal.py
          python scripts/enrich_next_fixture.py
          python scripts/enrich_tv_picks.py
          python scripts/refresh_story_images.py

      - name: Validate protected brief rules
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for profile in ('pete','sofia'):
              p=Path('data')/f'{profile}.json'
              data=json.loads(p.read_text())
              assert data.get('weather',{}).get('source')=='Met Office', f'{profile}: weather source changed'
              ext=data.get('weather',{}).get('yesterdayExtremes',{})
              assert ext.get('source')=='Met Office', f'{profile}: extremes source changed'
              picks=data.get('watch') or []
              assert len(picks)>=4, f'{profile}: fewer than 4 TV Picks'
              assert all((x.get('title') or '').strip() for x in picks), f'{profile}: unnamed TV Pick'

          pete=json.loads((Path('data')/'pete.json').read_text())
          fixture=(pete.get('arsenal') or {}).get('nextFixture')
          if fixture:
              required=('opponent','stadium','kickoff','competition','tvChannel')
              for key in required:
                  assert str(fixture.get(key) or '').strip(), f'Arsenal next fixture missing {key}'
              previous=fixture.get('previousMeeting') or {}
              assert str(previous.get('score') or '').strip(), 'Arsenal next fixture missing previous-meeting score'

          rules=json.loads(Path('data/story-images.json').read_text())
          seen={}
          for article,rule in rules.items():
              src=rule.get('src') if isinstance(rule,dict) else None
              assert src, f'missing image src for {article}'
              key=src.split('#',1)[0]
              assert key not in seen, f'duplicate story image: {article} and {seen.get(key)}'
              seen[key]=article
          print(f'Validated {len(rules)} unique story image rules, programme-first TV Picks and full Arsenal fixture details')
          PY

      - name: Commit refreshed data
        run: |
          git config user.name "Daily Briefs Bot"
          git config user.email "actions@users.noreply.github.com"

          mkdir -p /tmp/daily-briefs-data
          cp data/*.json /tmp/daily-briefs-data/

          git fetch origin main
          git reset --hard origin/main
          cp /tmp/daily-briefs-data/*.json data/

          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi

          git commit -m "Morning refresh: $(TZ=Europe/London date '+%Y-%m-%d')"
          git push origin main
