name: Morning refresh

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/morning-refresh.yml'
      - 'scripts/**'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: daily-briefs-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh brief data
        env:
          GOOGLE_CALENDAR_ICS_URL: ${{ secrets.GOOGLE_CALENDAR_ICS_URL }}
        run: |
          python scripts/refresh.py
          python scripts/enrich_weather_v2.py
          python scripts/enrich_arsenal.py
          python scripts/finalize_arsenal.py
          python scripts/enrich_next_fixture.py
          python scripts/enrich_tv_picks.py
          python scripts/refresh_story_images.py

      - name: Validate protected brief rules
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for profile in ('pete','sofia'):
              p=Path('data')/f'{profile}.json'
              data=json.loads(p.read_text())
              assert data.get('weather',{}).get('source')=='Met Office', f'{profile}: weather source changed'
              ext=data.get('weather',{}).get('yesterdayExtremes',{})
              assert ext.get('source')=='Met Office', f'{profile}: extremes source changed'
              assert not ext.get('error'), f"{profile}: England extremes unavailable: {ext.get('error')}"
              for kind in ('hot','cold'):
                  place=ext.get(kind) or {}
                  assert place.get('country')=='England', f'{profile}: {kind} extreme is not in England'
                  assert str(place.get('town') or '').strip(), f'{profile}: {kind} extreme missing town'
                  assert str(place.get('county') or '').strip(), f'{profile}: {kind} extreme missing county'
                  expected=f"{place['town']}, {place['county']}"
                  assert place.get('displayLocation')==expected, f'{profile}: {kind} extreme does not show town and county'
              picks=data.get('watch') or []
              assert len(picks)>=4, f'{profile}: fewer than 4 TV Picks'
              assert all((x.get('title') or '').strip() for x in picks), f'{profile}: unnamed TV Pick'

          pete=json.loads((Path('data')/'pete.json').read_text())
          sofia=json.loads((Path('data')/'sofia.json').read_text())
          pete_jobs=(pete.get('sections') or {}).get('Career') or []
          assert pete_jobs, 'Pete Career has no current jobs'
          for job in pete_jobs:
              assert job.get('contentType') == 'job', 'Pete Career contains non-job content'
              assert job.get('countryFocus') == 'UK', 'Pete Career contains a non-UK role'
              assert str(job.get('url') or '').startswith(('https://','http://')), 'Pete Career job missing real link'

          sofia_jobs=(sofia.get('sections') or {}).get('Career') or []
          assert sofia_jobs, 'Sofia Career has no current jobs'
          for job in sofia_jobs:
              assert job.get('contentType') == 'job', 'Sofia Career contains non-job content'
              assert job.get('workArrangement') in {'remote','3-wfh-days'}, 'Sofia Career contains an ineligible work pattern'
              assert job.get('countryFocus') in {'UK','Sweden','Europe/remote'}, 'Sofia Career contains an ineligible location'
              assert str(job.get('url') or '').startswith(('https://','http://')), 'Sofia Career job missing real link'

          fixture=(pete.get('arsenal') or {}).get('nextFixture')
          if fixture:
              required=('opponent','stadium','kickoff','competition','tvChannel')
              for key in required:
                  assert str(fixture.get(key) or '').strip(), f'Arsenal next fixture missing {key}'
              previous=fixture.get('previousMeeting') or {}
              assert str(previous.get('score') or '').strip(), 'Arsenal next fixture missing previous-meeting score'

          rules=json.loads(Path('data/story-images.json').read_text())
          seen={}
          for article,rule in rules.items():
              src=rule.get('src') if isinstance(rule,dict) else None
              assert src, f'missing image src for {article}'
              key=src.split('#',1)[0]
              assert key not in seen, f'duplicate story image: {article} and {seen.get(key)}'
              seen[key]=article

          def unique_links(items):
              return list(dict.fromkeys(
                  str(item.get('url') or '').strip()
                  for item in items
                  if str(item.get('url') or '').strip()
              ))

          def story_tabs(data, profile):
              sections=data.get('sections') or {}
              news=[]
              if profile=='sofia':
                  news.extend(sections.get('Sweden') or [])
              news.extend(sections.get('Local news') or [])
              news.extend(sections.get('UK news') or [])
              tabs={
                  'news': unique_links(news),
                  'ai': unique_links(sections.get('AI') or []),
                  'career': unique_links(sections.get('Career') or []),
              }
              if profile=='pete':
                  tabs['arsenal']=unique_links(
                      ((data.get('arsenal') or {}).get('news') or [])
                      + (sections.get('Arsenal news') or [])
                  )
              return tabs

          for profile,data in (('pete',pete),('sofia',sofia)):
              for tab,links in story_tabs(data,profile).items():
                  expected=min(5,len(links))
                  actual=sum(url in rules for url in links)
                  assert actual>=expected, f'{profile} {tab}: only {actual}/{expected} articles have images'
          print(f'Validated {len(rules)} unique story image rules with five-image tab coverage, England-only weather extremes, UK/Sweden-focused jobs, programme-first TV Picks and full Arsenal fixture details')
          PY

      - name: Commit refreshed data
        run: |
          git config user.name "Daily Briefs Bot"
          git config user.email "actions@users.noreply.github.com"

          mkdir -p /tmp/daily-briefs-data
          cp data/*.json /tmp/daily-briefs-data/

          git fetch origin main
          git reset --hard origin/main
          cp /tmp/daily-briefs-data/*.json data/

          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi

          git commit -m "Morning refresh: $(TZ=Europe/London date '+%Y-%m-%d')"
          git push origin main
