name: Morning refresh

on:
  schedule:
    # GitHub cron is UTC. Include 04:00 UTC for 05:00 BST and 05:00 UTC
    # for 05:00 GMT, then retain half-hour recovery opportunities to 06:30 UTC.
    # The London-time gate skips pre-05:00 and already-published editions.
    # Keep the same half-hour recovery window as two explicit schedules. Saving
    # these entries re-registers the cron after a repository visibility change.
    - cron: '0 4-6 * * *'
    - cron: '30 4-6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [morning_refresh, external_timer]
  push:
    branches: [main]
    paths:
      - '.github/workflows/morning-refresh.yml'
      - '.github/refresh-trigger.txt'
      - 'scripts/**'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: daily-briefs-data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check 05:00 London freshness
        id: refresh-gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python scripts/refresh_gate.py

      - name: Set up Python
        if: steps.refresh-gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.refresh-gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Report fact reserve without blocking publication
        run: python scripts/fact_reserve.py

      - name: Run refresh regression tests
        if: steps.refresh-gate.outputs.should_run == 'true'
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Refresh brief data
        if: steps.refresh-gate.outputs.should_run == 'true'
        env:
          GOOGLE_CALENDAR_ICS_URL: ${{ secrets.GOOGLE_CALENDAR_ICS_URL }}
          GOOGLE_CALENDAR_COLORS_URL: ${{ secrets.GOOGLE_CALENDAR_COLORS_URL }}
        run: |
          python scripts/refresh.py
          python scripts/enrich_weather_v2.py
          python scripts/enrich_arsenal.py
          python scripts/finalize_arsenal.py
          python scripts/enrich_next_fixture.py
          python scripts/enrich_tv_picks.py
          python scripts/refresh_story_images.py

      - name: Validate protected brief rules
        if: steps.refresh-gate.outputs.should_run == 'true'
        run: python scripts/validate_brief.py

      - name: Commit refreshed data
        if: steps.refresh-gate.outputs.should_run == 'true'
        run: |
          git config user.name "Daily Briefs Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/*.json assets/weather-extremes/*.webp assets/scenery/*.webp assets/news-images/*.webp
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi

          git commit -m "Morning refresh: $(TZ=Europe/London date '+%Y-%m-%d')"
          git pull --rebase origin main
          git push origin main
