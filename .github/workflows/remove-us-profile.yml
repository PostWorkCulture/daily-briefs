name: Remove obsolete Us profile
on:
  push:
    paths:
      - '.github/workflows/remove-us-profile.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Finalize profile cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/refresh.py')
          s=p.read_text()
          s=s.replace('    us_sections = {"Local ideas": family, "Local news": local, "UK news": uk}\n','')
          s=s.replace('        "us": {"updatedLabel": stamp, "weather": wx, "calendar": cal, "lead": first(family or local, "Your shared day is ready."), "interests": [dict(first(family, "Family ideas"), section="Family"), dict(first(local, "Local"), section="Local"), dict(first(tonight, "Tonight"), section="Watch")], "watch": tonight, "sections": us_sections},\n','')
          p.write_text(s)

          p=Path('js/app.js')
          s=p.read_text()
          old="const state={profile:localStorage.getItem('dailyBriefProfile')||'pete',data:null,calendarRange:'soon'};\nconst meta={pete:{name:'Pete',intro:'Your day, filtered down to the things worth knowing.'},sofia:{name:'Sofia',intro:'Your personalised day, without having to hunt for it.'},us:{name:'',intro:'One shared view of the day ahead.'}};"
          new="const savedProfile=localStorage.getItem('dailyBriefProfile');\nconst state={profile:['pete','sofia'].includes(savedProfile)?savedProfile:'pete',data:null,calendarRange:'soon'};\nconst meta={pete:{name:'Pete',intro:'Your day, filtered down to the things worth knowing.'},sofia:{name:'Sofia',intro:'Your personalised day, without having to hunt for it.'}};"
          if old in s:
              s=s.replace(old,new,1)
          s=s.replace("$('#greeting').textContent=state.profile==='us'?'Morning.':`Morning, ${p.name}.`;", "$('#greeting').textContent=`Morning, ${p.name}.`;")
          s=s.replace("$('#profileAvatar').textContent=state.profile==='us'?'US':p.name[0];", "$('#profileAvatar').textContent=p.name[0];")
          p.write_text(s)
          PY
          rm -f data/us.json
          grep -q '"pete":' scripts/refresh.py
          grep -q '"sofia":' scripts/refresh.py
          if grep -q '"us":' scripts/refresh.py; then echo 'Us profile still present' >&2; exit 1; fi
          if grep -q "meta=.*us:" js/app.js; then echo 'Us frontend metadata still present' >&2; exit 1; fi
          git config user.name 'Daily Briefs Cleanup'
          git config user.email 'actions@users.noreply.github.com'
          git add -A scripts/refresh.py js/app.js data
          if git diff --cached --quiet; then echo 'Cleanup already complete'; exit 0; fi
          git commit -m 'Finalize Pete and Sofia profile split'
          git push
