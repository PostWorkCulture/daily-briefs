<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071426">
  <title>Daily Briefs</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">Daily <span>Briefs</span></div>
      <div class="profile-avatar" id="profileAvatar">P</div>
    </header>

    <div class="profile-switch" aria-label="Choose profile">
      <button class="active" data-profile="pete">Pete</button>
      <button data-profile="sofia">Sofia</button>
      <button data-profile="us">Us</button>
    </div>

    <section class="hero">
      <div class="eyebrow" id="briefDate">Loading brief…</div>
      <h1 id="greeting">Morning, Pete.</h1>
      <p id="intro">Your day, filtered down to the things worth knowing.</p>
      <div class="status-grid">
        <article class="status-card"><span>Weather</span><strong id="weatherTemp">—</strong><small id="weatherSummary">Loading</small></article>
        <article class="status-card"><span>Calendar</span><strong id="calendarCount">—</strong><small>upcoming</small></article>
        <article class="status-card"><span>Stories</span><strong id="storyCount">—</strong><small>fresh items</small></article>
      </div>
    </section>

    <section class="dashboard-grid">
      <div class="main-column">
        <section class="panel-block">
          <div class="section-head"><h2>Morning brief</h2></div>
          <article class="hero-card" id="leadCard"><div class="tag">Top story</div><h3>Loading today’s brief…</h3><p></p></article>
        </section>

        <section class="panel-block">
          <div class="section-head"><h2>Coming up</h2></div>
          <div class="list-card" id="calendarList"></div>
        </section>
      </div>

      <aside class="side-column">
        <section class="panel-block">
          <div class="section-head"><h2>For you</h2></div>
          <div class="interest-grid" id="interestGrid"></div>
        </section>

        <section class="panel-block">
          <div class="section-head"><h2>Tonight</h2></div>
          <div class="watch-strip" id="watchStrip"></div>
        </section>
      </aside>
    </section>

    <section class="panel-block full-width">
      <div class="section-head"><h2>Everything else</h2></div>
      <div class="content-groups" id="contentGroups"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="active" data-scroll="top"><b>⌂</b>Home</button>
    <button data-scroll="contentGroups"><b>◇</b>Discover</button>
    <button data-scroll="watchStrip"><b>▶</b>Watch</button>
    <button data-scroll="calendarList"><b>◷</b>Calendar</button>
  </nav>

  <script src="js/app.js" defer></script>
</body>
</html>
